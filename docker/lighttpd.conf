# AISSeaStats — lighttpd front for PHP-FPM (same config in Docker and native installs)

server.modules = ( "mod_access", "mod_setenv", "mod_fastcgi" )

server.document-root = "/app/public"
server.port          = 8080
server.username      = "www-data"
server.groupname     = "www-data"
server.tag           = ""
server.max-request-size = 10240
server.stream-response-body = 1

index-file.names = ( "index.php" )
static-file.exclude-extensions = ( ".php" )
url.access-deny = ( "~", ".inc", ".map" )

# Never serve dotfiles.
$HTTP["url"] =~ "/\." {
  url.access-deny = ( "" )
}

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "text/javascript; charset=utf-8",
  ".json" => "application/json",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".ico"  => "image/x-icon",
  ".txt"  => "text/plain; charset=utf-8",
  ".md"   => "text/plain; charset=utf-8",
  ""      => "application/octet-stream"
)

setenv.add-response-header = ( "X-Content-Type-Options" => "nosniff" )
$HTTP["url"] =~ "^/assets/" {
  setenv.add-response-header = (
    "X-Content-Type-Options" => "nosniff",
    "Cache-Control" => "public, max-age=604800"
  )
}

fastcgi.server = (
  ".php" => ((
    "host" => "127.0.0.1",
    "port" => 9000,
    "check-local" => "enable",
    "broken-scriptfilename" => "enable"
  ))
)
