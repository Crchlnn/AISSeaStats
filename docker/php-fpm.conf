; AISSeaStats PHP-FPM overrides. Installed as zzz-aisseastats.conf so it loads after the image's zz-docker.conf.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Keep DB_* variables from Docker Compose visible to PHP.
clear_env = no
catch_workers_output = yes
; No per-request access log (ingestion posts every 15 s).
access.log = /dev/null
decorate_workers_output = no
