name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: aisseastats_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zlib
          coverage: none
      - name: Lint PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: aisseastats_test
          DB_USER: test
          DB_PASSWORD: test
        run: php tests/run.php
      - name: Smoke test (setup wizard, admin login, ingestion)
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: aisseastats_test
          DB_USER: test
          DB_PASSWORD: test
        run: sh tests/smoke.sh
      - name: Shellcheck
        run: shellcheck install.sh docker/entrypoint.sh tests/smoke.sh

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
